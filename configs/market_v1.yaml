# 시장·외부환경(README 6.4) 통계 연결 v1 (docs/decisions.md D18)
version: market_v1
title: 기준일 현재 확보한 통계로 본 2021~2025 회고 추세
question: 한국 화장품 생산 규모는 어떻게 변했으며, 이 자료는 각 파일럿 기업의 사업 범위를 어느 정도 설명하는가?
# 페이지 갱신일은 수집본의 갱신일이다. 각 연도 당시 이용 가능 정보만 쓰는 분석은 과거 통계본을 확보한 뒤 따로 만든다
score_use: 미반영 — 시장 배점 15의 점수 반영은 연결 판정 검토 뒤 결정
years: [2021, 2022, 2023, 2024, 2025]  # 2021은 2022 증감률의 기초값
base_statistic:
  candidate_id: M01
  raw_source: data/raw/stats/index_go_kr/3043
  series: 생산금액
  growth_series: 전년대비 성장률  # 공식 표의 증감률 — 계산값과 소수 첫째 자리까지 대조
  context_series: [업체수]  # 생산실적을 보고한 책임판매업체 수 — 집계 대상이 해마다 달라진다
  label: 국내 화장품 생산금액 (책임판매업체 보고 기준, 명목)
  not_to_call: [ODM 시장 규모, 소비자 시장 규모, 글로벌 수요, 실질 성장]
# 연평균 성장률은 기간 선택에 민감하다 — 두 기간을 함께 보여 준다
cagr_spans: [[2022, 2025], [2021, 2025]]
# 확인 전까지 비교 주의로 표시하는 구간 (원인을 추정하지 않음)
caution_pairs:
  - pair: [2021, 2022]
    text: 2021→2022 큰 감소(-18.4%) — 원인·작성 기준 변경 여부 미확인, 단순 증감 해석 주의
judgements:
  비교 가능: 지역·제품·측정 대상·기간이 비교 목적에 맞음
  조건부 참고: 산업 환경 설명에는 유용하지만 기업 전체를 대표하지 못함 — 점수에 넣지 않음
  연결 보류: 범위를 판단할 자료가 부족하거나 차이가 큼
# 유형별 생산실적 (D19) — 같은 통계(화장품산업현황)의 유형별 표. 사용자가 브라우저로 내려받은 원표
type_statistic:
  candidate_id: M02
  raw_source: data/raw/stats/kosis/DT_145011_A013
  total_label: 합계
  unit: 억원
  # 합계가 M01 생산금액(백만원)을 억원으로 반올림한 값과 같은지 확인 (같은 통계의 두 표)
  check_total_against: M01
  # 보고서에 따로 보여 줄 유형 (나머지는 표에만)
  focus_types: [기초화장용 제품류, 색조화장용 제품류, 눈화장용 제품류, 두발용 제품류, 인체세정용 제품류]
